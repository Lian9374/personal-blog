<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- 页脚片段 -->
<footer th:fragment="footer" class="footer">
    <div class="container">
        <div class="footer-inner">
            <div>
                <div class="footer-brand">
                    <span class="brand-logo">🗨️</span><span>云麓论坛</span>
                </div>
                <p class="footer-desc">
                    一个由 Spring Boot + PostgreSQL 驱动的论坛：支持版块、标签、Markdown、互动与站内通知。
                </p>
            </div>
            <div>
                <h4 class="footer-title">版块导航</h4>
                <th:block th:if="${boards != null}">
                    <a class="footer-link" th:each="b : ${boards}"
                       th:href="@{/board/{id}(id=${b.id})}" th:text="${b.name}">版块</a>
                </th:block>
            </div>
            <div>
                <h4 class="footer-title">快速入口</h4>
                <a class="footer-link" th:href="@{/}">首页</a>
                <a class="footer-link" th:href="@{/search}">搜索</a>
                <a class="footer-link" th:href="@{/article/create}">发帖</a>
                <a class="footer-link" th:if="${session.loginUser != null and session.loginUser.role == 'ADMIN'}"
                   th:href="@{/admin}">管理后台</a>
            </div>
        </div>
        <div class="footer-bottom">
            © 2026 云麓论坛 · Spring Boot 3 · MyBatis Plus · PostgreSQL · Thymeleaf
        </div>
    </div>
</footer>

</body>
</html>
