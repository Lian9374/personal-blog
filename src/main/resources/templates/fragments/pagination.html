<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- 分页: url 为基础路径(可含固定查询参数, 如 /board/1?essence=1), page 为 IPage 对象 -->
<nav th:fragment="pagination(page, url)" class="pagination"
     th:if="${page != null and page.pages > 1}">
    <a class="btn btn-outline" th:if="${page.current > 1}"
       th:href="@{${url}(page=${page.current - 1})}">上一页</a>
    <span class="page-info" th:text="${'第 ' + page.current + ' / ' + page.pages + ' 页'}">页码</span>
    <a class="btn btn-outline" th:if="${page.current < page.pages}"
       th:href="@{${url}(page=${page.current + 1})}">下一页</a>
</nav>

</body>
</html>
