<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>首页 - 云麓论坛</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div th:replace="~{fragments/nav :: flash}"></div>

<main class="container layout">
    <div class="main-col">
        <div class="welcome-bar">
            <h1 class="page-title">版块</h1>
            <a class="btn btn-primary" th:href="@{/article/create}">+ 发帖</a>
        </div>

        <div class="board-grid">
            <a class="board-card" th:each="b : ${boards}" th:href="@{/board/{id}(id=${b.id})}">
                <div class="board-card-head">
                    <span class="board-name" th:text="${b.name}">版块</span>
                    <span class="badge badge-count" th:text="${b.articleCount != null ? b.articleCount : 0}">0</span>
                </div>
                <p class="board-desc" th:text="${b.description}">简介</p>
                <span class="board-last" th:if="${b.lastArticleTime != null}"
                      th:text="${'最后发帖: ' + b.lastArticleTime}">最后发帖</span>
            </a>
        </div>

        <h2 class="section-title">最新帖子</h2>
        <div th:replace="~{fragments/article-row :: list(${latest})}"></div>
    </div>

    <aside class="side-col">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    </aside>
</main>
</body>
</html>
