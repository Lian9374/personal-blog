<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>云麓论坛 - 技术交流社区</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div th:replace="~{fragments/nav :: flash}"></div>

<!-- Hero 横幅 -->
<section class="hero">
    <div class="hero-inner">
        <h1 class="hero-title">欢迎来到云麓论坛 🎉</h1>
        <p class="hero-sub">分享知识、交流技术、结识同好。用 Markdown 写下你的想法，和社区一起成长。</p>
        <div class="hero-search">
            <form th:action="@{/search}" method="get">
                <input type="text" name="q" placeholder="搜索帖子、标签或用户..." required>
                <button class="btn btn-primary" type="submit">🔍 搜索</button>
            </form>
        </div>
    </div>
</section>

<!-- 内容中心三栏布局 -->
<main class="container layout-3">
    <div th:replace="~{fragments/left-rail :: left(null)}"></div>

    <div class="main-col">
        <div class="announcement">
            <span class="announcement-icon">📢</span>
            <span>欢迎来到云麓论坛！请友善交流，文明发言，共同维护良好的社区氛围。</span>
        </div>

        <div class="welcome-bar">
            <h2 class="section-title">最新帖子</h2>
            <a class="btn btn-primary btn-sm" th:href="@{/article/create}">+ 发帖</a>
        </div>

        <div th:replace="~{fragments/article-row :: list(${page.records})}"></div>
        <div th:replace="~{fragments/pagination :: pagination(${page}, '/')}"></div>
    </div>

    <div th:replace="~{fragments/right-rail :: right}"></div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
