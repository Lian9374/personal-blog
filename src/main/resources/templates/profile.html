<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>个人中心 - 云麓论坛</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div th:replace="~{fragments/nav :: flash}"></div>

<main class="container layout-2">
    <div th:replace="~{fragments/left-rail :: left(null)}"></div>

    <div class="main-col">
        <h1 class="page-title">个人中心</h1>

        <div class="avatar-upload">
            <img class="avatar avatar-xl" th:if="${user.avatar != null}" th:src="${user.avatar}" alt="头像">
            <span class="avatar avatar-xl avatar-placeholder" th:unless="${user.avatar != null}"
                  th:text="${#strings.substring(user.nickname != null ? user.nickname : user.username, 0, 1)}">U</span>
            <form method="post" enctype="multipart/form-data" th:action="@{/profile/avatar}">
                <div class="avatar-upload-controls">
                    <input type="file" name="avatar" accept="image/jpeg,image/png,image/gif,image/webp" required>
                    <button class="btn btn-outline btn-sm" type="submit">上传头像</button>
                </div>
            </form>
        </div>

        <form class="form" th:action="@{/profile}" method="post">
            <div class="form-group">
                <label for="username">用户名（不可修改）</label>
                <input type="text" id="username" th:value="${user.username}" disabled>
            </div>
            <div class="form-group">
                <label for="nickname">昵称</label>
                <input type="text" id="nickname" name="nickname" maxlength="50" th:value="${user.nickname}">
            </div>
            <div class="form-group">
                <label for="email">邮箱</label>
                <input type="email" id="email" name="email" maxlength="100" th:value="${user.email}">
            </div>
            <div class="form-group">
                <label for="bio">个人简介</label>
                <textarea id="bio" name="bio" rows="3" maxlength="200" th:text="${user.bio}"></textarea>
            </div>
            <div class="form-group">
                <label for="newPassword">新密码（留空则不修改）</label>
                <input type="password" id="newPassword" name="newPassword">
            </div>
            <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>
            <div class="form-actions">
                <button class="btn btn-primary" type="submit">保存修改</button>
                <a class="btn btn-outline" th:href="@{/}">返回首页</a>
            </div>
        </form>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
