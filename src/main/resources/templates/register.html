<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>注册 - 云麓论坛</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div th:replace="~{fragments/nav :: flash}"></div>

<main class="auth-wrap">
    <div class="auth-card">
        <div class="auth-logo"><span class="brand-logo">🗨️</span></div>
        <h1 class="auth-title">加入云麓论坛</h1>
        <p class="auth-sub">注册一个账号，开始分享与交流</p>

        <form class="form" th:action="@{/register}" method="post">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" maxlength="50" th:value="${username}" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <label for="nickname">昵称（选填）</label>
                <input type="text" id="nickname" name="nickname" maxlength="50" th:value="${nickname}">
            </div>
            <div class="form-group">
                <label for="email">邮箱（选填）</label>
                <input type="email" id="email" name="email" maxlength="100" th:value="${email}">
            </div>
            <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>
            <button class="btn btn-primary" style="width:100%" type="submit">注 册</button>
            <p class="form-tip" style="text-align:center">已有账号？<a th:href="@{/login}">直接登录</a></p>
        </form>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
