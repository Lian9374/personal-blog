<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>登录 - 个人博客</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div th:replace="~{fragments/nav :: flash}"></div>

<main class="container narrow">
    <h1 class="page-title">登录</h1>

    <form class="form" th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">用户名</label>
            <input type="text" id="username" name="username" th:value="${username}" required autofocus>
        </div>
        <div class="form-group">
            <label for="password">密码</label>
            <input type="password" id="password" name="password" required>
        </div>
        <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>
        <button class="btn btn-primary" type="submit">登录</button>
        <p class="form-tip">还没有账号？<a th:href="@{/register}">立即注册</a></p>
    </form>
</main>
</body>
</html>
