<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录 - 云麓论坛</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div th:replace="~{fragments/nav :: flash}"></div>

<main class="auth-wrap">
    <div class="auth-card">
        <div class="auth-logo"><span class="brand-logo">🗨️</span></div>
        <h1 class="auth-title">欢迎回来</h1>
        <p class="auth-sub">登录云麓论坛，继续你的交流</p>

        <form class="form" th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" th:value="${username}" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>
            <button class="btn btn-primary" style="width:100%" type="submit">登 录</button>
            <p class="form-tip" style="text-align:center">还没有账号？<a th:href="@{/register}">立即注册</a></p>
        </form>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
