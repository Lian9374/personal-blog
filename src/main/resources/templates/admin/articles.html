<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>帖子管理 - 云麓论坛</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div th:replace="~{fragments/nav :: flash}"></div>

<main class="container layout">
    <aside class="side-col">
        <div th:replace="~{fragments/admin/sidebar :: sidebar}"></div>
    </aside>
    <div class="main-col">
        <h1 class="page-title">帖子管理</h1>
        <table class="admin-table">
            <thead>
            <tr><th>ID</th><th>标题</th><th>版块</th><th>作者</th><th>回复</th><th>置顶</th><th>精华</th><th>删除</th></tr>
            </thead>
            <tbody>
            <tr th:each="a : ${page.records}">
                <td th:text="${a.id}">1</td>
                <td><a th:href="@{/article/{id}(id=${a.id})}" th:text="${a.title}">标题</a></td>
                <td th:text="${a.boardName}">版块</td>
                <td th:text="${a.authorName}">作者</td>
                <td th:text="${a.commentCount != null ? a.commentCount : 0}">0</td>
                <td>
                    <form class="inline-form" method="post" th:action="@{/admin/articles/{id}/pin(id=${a.id})}">
                        <button class="btn btn-sm" th:classappend="${a.pinned} ? 'btn-primary' : 'btn-outline'"
                                th:text="${a.pinned} ? '已置顶' : '置顶'">置顶</button>
                    </form>
                </td>
                <td>
                    <form class="inline-form" method="post" th:action="@{/admin/articles/{id}/essence(id=${a.id})}">
                        <button class="btn btn-sm" th:classappend="${a.essence} ? 'btn-primary' : 'btn-outline'"
                                th:text="${a.essence} ? '已精华' : '精华'">精华</button>
                    </form>
                </td>
                <td>
                    <form class="inline-form" method="post" th:action="@{/admin/articles/{id}/delete(id=${a.id})}"
                          th:onsubmit="return confirm('确定删除这篇帖子？');">
                        <button class="btn btn-danger btn-sm" type="submit">删除</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
        <div th:replace="~{fragments/pagination :: pagination(${page}, '/admin/articles')}"></div>
    </div>
</main>
</body>
</html>
