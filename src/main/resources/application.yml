server:
  # Render 平台通过环境变量 PORT 指定监听端口, 本地开发默认 8080
  port: ${PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: personal-blog

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 数据库地址/账号/密码均支持环境变量覆盖(部署时指向外部 MySQL), 本地不设时回退到本机默认
    url: ${DB_URL:jdbc:mysql://localhost:3306/personal_blog?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    # 数据库密码: 从环境变量 DB_PASSWORD 读取, 仓库中不含明文凭据
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  thymeleaf:
    cache: false
    encoding: UTF-8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

logging:
  level:
    com.personalblog: DEBUG
