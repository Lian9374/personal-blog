server:
  # Render 平台通过环境变量 PORT 指定监听端口, 本地开发默认 8080
  port: ${PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: personal-blog

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

  datasource:
    driver-class-name: org.postgresql.Driver
    # Render 托管 PostgreSQL 会自动注入 PGHOST/PGPORT/PGDATABASE/PGUSER/PGPASSWORD;
    # 本地不设时回退到本机默认 (localhost:5432, postgres 用户, 本机可不加密)
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:personal_blog}?sslmode=${PGSSLMODE:disable}
    username: ${PGUSER:postgres}
    # 数据库密码: 从环境变量 PGPASSWORD 读取, 仓库中不含明文凭据
    password: ${PGPASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  thymeleaf:
    cache: false
    encoding: UTF-8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

logging:
  level:
    com.personalblog: DEBUG
