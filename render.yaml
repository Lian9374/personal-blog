# ============================================================
# Render Blueprint - 个人博客 (Spring Boot + PostgreSQL)
# Render 无 Java 原生运行时, 必须 runtime: docker + Dockerfile
# PostgreSQL 用 Render 自带的托管数据库: 蓝图自动建库并注入连接信息
#
# 使用方式:
#   1. 删除之前误建的 Static Site / Node.js Web Service
#   2. Render 控制台 -> New -> Blueprint -> 选择本仓库 -> Apply
#   3. 蓝图会自动创建 PostgreSQL 数据库, 并把 PGHOST/PGPORT/...
#      等连接信息注入服务, 无需手动填任何环境变量
# ============================================================

databases:
  - name: personal-blog-db
    plan: free
    region: singapore
    databaseName: personal_blog
    user: personal_blog

services:
  - type: web
    name: personal-blog
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      # 自动注入 Render 托管 PostgreSQL 的连接信息 (host/port/db/user/password)
      - key: PGHOST
        fromDatabase:
          name: personal-blog-db
          property: host
      - key: PGPORT
        fromDatabase:
          name: personal-blog-db
          property: port
      - key: PGDATABASE
        fromDatabase:
          name: personal-blog-db
          property: database
      - key: PGUSER
        fromDatabase:
          name: personal-blog-db
          property: user
      - key: PGPASSWORD
        fromDatabase:
          name: personal-blog-db
          property: password
      # Render 托管 PostgreSQL 走加密连接
      - key: PGSSLMODE
        value: require
