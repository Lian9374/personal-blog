# ============================================================
# Render Blueprint - 个人博客 (Spring Boot + PostgreSQL)
# Render 无 Java 原生运行时, 必须 runtime: docker + Dockerfile
# PostgreSQL 用 Render 自带的托管数据库: 蓝图自动建库并把连接串注入
# 服务环境变量 DATABASE_URL (应用直接读取, 无需手动配置)
#
# 使用方式:
#   1. 删除之前误建的 Static Site / Node.js Web Service
#   2. Render 控制台 -> New -> Blueprint -> 选择本仓库 -> Apply
#   3. 蓝图会自动创建 PostgreSQL 数据库, 并注入 DATABASE_URL 到 Web Service
#      (无需手动填任何环境变量)
# ============================================================

databases:
  - name: personal-blog-db
    plan: free
    region: singapore
    databaseName: personal_blog
    user: personal_blog

services:
  - type: web
    name: personal-blog
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      # 自动注入 Render 托管 PostgreSQL 的连接串 (postgres://user:pass@host:port/db)
      - key: DATABASE_URL
        fromDatabase:
          name: personal-blog-db
          property: connectionString
